
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="registration1.css">
</head>
<body>

    <div class="registration-container">

        <div class="registration-card">

            <h2>Registration</h2>

            <form action="#" method="post">

                <!-- Personal Details -->
                <h4 class="section-title">Personal Details</h4>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname"
                               placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email"
                               placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile number</label>
                        <input type="tel" id="mobile"
                               placeholder="Enter mobile number" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="occupation">Occupation</label>
                        <input type="text" id="occupation"
                               placeholder="Enter occupation" required>
                    </div>

                </div>

                <!-- Identity Details -->
                <h4 class="section-title identity-title">
                    Identity Details
                </h4>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="idtype">ID Type</label>
                        <select id="idtype" required>
                            <option value="">Select ID type</option>
                            <option>Passport</option>
                            <option>Driving Licence</option>
                            <option>Voter ID</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="idnumber">ID Number</label>
                        <input type="text" id="idnumber"
                               placeholder="Enter ID number" required>
                    </div>

                    <div class="form-group">
                        <label for="authority">Issue Authority</label>
                        <input type="text" id="authority"
                               placeholder="Enter issue department" required>
                    </div>

                    <div class="form-group">
                        <label for="issuedate">Issue Date</label>
                        <input type="date" id="issuedate" required>
                    </div>

                    <div class="form-group">
                        <label for="state">Issue State</label>
                        <input type="text" id="state"
                               placeholder="Enter ID issue state" required>
                    </div>

                    <div class="form-group">
                        <label for="expirydate">Expiry Date</label>
                        <input type="date" id="expirydate" required>
                    </div>

                </div>

                <button type="submit" class="next-button">
                    Next <span>→</span>
                </button>

            </form>

        </div>

    </div>

</body>
</html>
