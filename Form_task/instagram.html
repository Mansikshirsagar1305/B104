
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="instagram.css">
</head>
<body>

    <div class="login-container">

        <!-- Left promotional section -->
        <div class="promo-section">
            <div class="instagram-logo">◎</div>

            <h2>
                See everyday moments from
                your <span>close friends.</span>
            </h2>

            <div class="photo-card">
                <div class="photo photo-one">😊</div>
                <div class="photo photo-two">📸</div>
                <div class="photo photo-three">💖</div>
            </div>
        </div>

        <!-- Right login section -->
        <div class="form-section">
            <h3>Log into Instagram</h3>

            <form action="#" method="post">
                <input
                    type="text"
                    placeholder="Mobile number, username or email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="login-btn">
                    Log in
                </button>
            </form>

            <a href="#" class="forgot-link">Forgot password?</a>

            <button class="facebook-btn" type="button">
                <span>f</span> Log in with Facebook
            </button>

            <button class="create-btn" type="button">
                Create new account
            </button>
        </div>

    </div>

</body>
</html>
