<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="Linkedin.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">

      <!-- Left: logo + search -->
      <div class="nav-left">
        <a href="#" class="logo" aria-label="LinkedIn">in</a>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search" />
        </div>
      </div>

      <!-- Right: nav items -->
      <nav class="nav-right">
        <ul class="nav-list">
          <li class="nav-item active">
            <a href="#">
              <i class="fa-solid fa-house"></i>
              <span>Home</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="#">
              <span class="icon-wrap">
                <i class="fa-solid fa-user-group"></i>
                <em class="badge">5</em>
              </span>
              <span>My Network</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="#">
              <i class="fa-solid fa-briefcase"></i>
              <span>Jobs</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="#">
              <i class="fa-solid fa-message"></i>
              <span>Messaging</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="#">
              <span class="icon-wrap">
                <i class="fa-solid fa-bell"></i>
                <em class="badge">25</em>
              </span>
              <span>Notifications</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="#">
              <img class="avatar" src="https://i.pravatar.cc/48?img=47" alt="Profile" />
              <span>Me <i class="fa-solid fa-caret-down caret"></i></span>
            </a>
          </li>

          <li class="divider"></li>

          <li class="nav-item">
            <a href="#">
              <i class="fa-solid fa-grip"></i>
              <span>For Business <i class="fa-solid fa-caret-down caret"></i></span>
            </a>
          </li>

          <li class="nav-item premium">
            <a href="#">
              <span class="premium-icon"></span>
              <span>Try Premium for ₹0</span>
            </a>
          </li>
        </ul>
      </nav>

    </div>
  </header>

</body>
</html>
