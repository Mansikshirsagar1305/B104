<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Identity Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 350px;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px #aaa;
        }

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4a6cf7;
        }

        h1 {
            margin: 15px 0;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .skills span {
            display: inline-block;
            background: #e0e7ff;
            color: #333;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
        }

        .links a {
            display: inline-block;
            margin: 10px;
            color: #4a6cf7;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            color: #222;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            src="https://placehold.co/120x120"
            alt="Profile Picture"
            class="profile"
        >

        <h1>Mansi Kshirsagar</h1>

        <p>
            Aspiring Software Developer.
            I love learning Java, HTML, CSS and web development.
        </p>

        <h3>My Skills</h3>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>SQL</span>
        </div>

        <div class="links">
            <a href="mailto:example@gmail.com">Email</a>
            <a href="https://www.linkedin.com/">LinkedIn</a>
            <a href="https://github.com/">GitHub</a>
        </div>

    </div>

</body>
</html>
