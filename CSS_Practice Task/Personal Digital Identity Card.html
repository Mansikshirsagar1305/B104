
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Digital Identity Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 350px;
            background: white;
            text-align: center;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.4s;
        }

        .profile-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
            transition: 0.4s;
        }

        .profile-img:hover {
            transform: scale(1.1);
            border-color: #764ba2;
        }

        h1 {
            margin-top: 20px;
            color: #333;
            font-size: 26px;
        }

        .designation {
            color: #764ba2;
            font-size: 17px;
            font-weight: bold;
            margin: 10px 0;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin: 15px 0;
        }

        .skills {
            margin: 20px 0;
        }

        .skills span {
            display: inline-block;
            background: #e8eaff;
            color: #4b55a5;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 13px;
            transition: 0.3s;
        }

        .skills span:hover {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #667eea;
            padding: 10px 14px;
            margin: 5px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .social-links a:hover {
            background: #764ba2;
            transform: translateY(-5px);
        }

        .contact-btn {
            display: inline-block;
            margin-top: 20px;
            background: #764ba2;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .contact-btn:hover {
            background: #333;
            letter-spacing: 1px;
        }

    </style>
</head>

<body>

    <div class="profile-card">

        <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80"
            alt="Profile Image"
            class="profile-img">

        <h1>Mansi Kshirsagar</h1>

        <p class="designation">Aspiring Software Developer</p>

        <p class="description">
            Hello! I am a passionate software developer.
            I enjoy learning new technologies and creating
            attractive websites and applications.
        </p>

        <h3>My Skills</h3>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>SQL</span>
            <span>JavaScript</span>
        </div>

        <div class="social-links">
            <a href="https://www.linkedin.com/"
               target="_blank">LinkedIn</a>

            <a href="https://github.com/"
               target="_blank">GitHub</a>

            <a href="https://www.instagram.com/"
               target="_blank">Instagram</a>
        </div>

        <a href="mailto:example@gmail.com" class="contact-btn">
            Contact Me
        </a>

    </div>

</body>
</html>
