
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Image Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: white;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            max-width: 450px;
        }

        .grid-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item1 {
            grid-column: 1;
            grid-row: 1;
        }

        .item2 {
            grid-column: 2;
            grid-row: 1;
        }

        .item3 {
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .item4 {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .item5 {
            grid-column: 1 / 3;
            grid-row: 3;
        }

        .item6 {
            grid-column: 3;
            grid-row: 3;
        }
    </style>
</head>

<body>

    <h2>Assignment II</h2>

    <div class="grid-container">
        <img class="item1"
             src="https://images.unsplash.com/photo-1498557850523-fd3d118b962e?w=400"
             alt="Blueberries">

        <img class="item2"
             src="https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400"
             alt="Strawberries">

        <img class="item3"
             src="https://images.unsplash.com/photo-1547514701-42782101795e?w=400"
             alt="Red fruit">

        <img class="item4"
             src="https://images.unsplash.com/photo-1547514701-42782101795e?w=600"
             alt="Citrus fruits">

        <img class="item5"
             src="https://images.unsplash.com/photo-1517282009859-f000ec3b26fe?w=600"
             alt="Papaya">

        <img class="item6"
             src="https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=400"
             alt="Pineapples">
    </div>

</body>
</html>
