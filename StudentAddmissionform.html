<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Admission Form</title>
</head>
<body>
  <h2>Student Admission Form</h2>
  <form action="/submit" method="post">

    <fieldset>
      <legend>Personal Information</legend>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required><br><br>

      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" required><br><br>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>
    </fieldset>

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="male"> Male</label><br>
      <label><input type="radio" name="gender" value="female"> Female</label><br>
      <label><input type="radio" name="gender" value="other"> Other</label>
    </fieldset>

    <fieldset>
      <legend>Hobbies</legend>
      <label><input type="checkbox" name="hobby" value="reading"> Reading</label><br>
      <label><input type="checkbox" name="hobby" value="sports"> Sports</label><br>
      <label><input type="checkbox" name="hobby" value="music"> Music</label><br>
      <label><input type="checkbox" name="hobby" value="travel"> Travel</label>
    </fieldset>

    <fieldset>
      <legend>Address</legend>
      <label for="address">Enter Address:</label><br>
      <textarea id="address" name="address" rows="4" cols="40"></textarea>
    </fieldset>

    <fieldset>
      <legend>Course Selection</legend>
      <label for="course">Choose Course:</label>
      <select id="course" name="course" required>
        <option value="">--Select a course--</option>
        <option value="bsc">B.Sc</option>
        <option value="bca">BCA</option>
        <option value="bcom">B.Com</option>
        <option value="ba">BA</option>
        <option value="mba">MBA</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Profile Picture</legend>
      <label for="profile">Upload Picture:</label>
      <input type="file" id="profile" name="profile">
    </fieldset>

    <fieldset>
      <legend>Preferences</legend>
      <label for="color">Favorite Color:</label>
      <input type="color" id="color" name="color"><br><br>

      <label for="skills">Skills Level:</label>
      <input type="range" id="skills" name="skills" min="0" max="10">
    </fieldset>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>
</body>
</html>
