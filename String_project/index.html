<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="display-3 p-5 text-center" style="text-shadow:2px 2px 2px orange">String operations in Js</h1>
    <div class="container w-50">
        <div class="mb-3">

  <textarea class="form-control" id="inputpara" rows="3"></textarea>
</div>
<div class="container bg-secondary text-white p-4 my-3"id="result">Result</div>
</div>
<div class="container">
    <div class="row">
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="toCapitalize()">toCapitalize</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="toLowerCase()">Convert to small case</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="titleCase()">Title Case</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="countSpaces()">Count Spaces</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="replaceSpacesWithHyphen()">Replace speces with hypen(-)</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="countLines()">Count lines </button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="countVowels()">Count voewls</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="countConsonants()">Count Consonents</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="reverseString()">Revers the String</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="checkPalindrome()">Check The Polindrom</button></div>
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="sortString()">Sort the String</button></div>'
        <div class="col-md-3 mb-2"><button class="btn btn-primary" onclick="reverseSentence() ">Revers the Given Sentence But word keep as it is</button></div>
        
</div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
